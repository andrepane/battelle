name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact npm dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m unittest tests/test_baremos_battelle.py
      - name: Battelle validators
        run: |
          python scripts/validar_items.py
          python scripts/validar_modelo_escalas.py
          python scripts/validar_baremos_battelle.py
          python scripts/validar_fuentes_excel.py
          python scripts/validar_limpieza_fuentes.py
      - name: Firestore rules in Firebase Emulator
        run: npm run test:firestore-rules
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code
